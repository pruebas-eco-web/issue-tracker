version: '3.8'

services:
  # ==============================================================================
  # 🗄️ LOCAL DATABASE SERVICE (MariaDB)
  # ==============================================================================
  local-db:
    image: mariadb:11.2
    container_name: incident_tracker_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: local_root_password
      MARIADB_DATABASE: incident_db
      MARIADB_USER: app_user
      MARIADB_PASSWORD: app_secure_password
    ports:
      - "3306:3306"
    volumes:
      # Keeps your database records safe on your Ubuntu drive when containers stop
      - mariadb_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 🚀 FASTAPI BACKEND API SERVICE
  # ==============================================================================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: incident_tracker_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      # Overrides the cloud string to target the local MariaDB container securely
      - DATABASE_URL=mysql+pymysql://app_user:app_secure_password@local-db:3306/incident_db
      - JWT_SECRET_KEY=local_development_secret_key_12345
      - ALLOWED_FRONTEND_URL=*
      # Email notification configurations are pulled directly from your local .env file
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    networks:
      - app-network
    # Ensures the backend doesn't boot up until MariaDB is completely ready for traffic
    depends_on:
      local-db:
        condition: service_healthy

volumes:
  mariadb_data:

networks:
  app-network:
    driver: bridge
